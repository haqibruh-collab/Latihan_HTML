<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Tabel</title>
</head>
<body>
    <table border="1" cellspacing="10" cellpadding="1" align="center">
        <caption>Ini Adalah Contoh Tabel di HTML</caption>
        <tr>
            <th>Ini kolom 1</th>
            <th>Ini Kolom 2</th>
            <th>Ini Kolom 3</th>
        </tr>
        <tr>
            <td colspan="2">Ini baris 1 Kolom 1</td>
            <!-- <td>Ini baris 2 Kolom 1</td> -->
            <td>Ini baris 3 Kolom 1</td>
        </tr>
        <tr>
            <td rowspan="2">Ini baris 1 Kolom 2</td>
            <td>Ini baris 2 Kolom 2</td>
            <td>Ini baris 3 Kolom 2</td>
        </tr>
        <tr>
            <!-- <td>Ini baris 1 kolom 3</td> -->
            <td>Ini baris 2 kolom 3</td>
            <td>Ini baris 3 kolom 3</td>
        </tr>
    </table>
</body>
</html>
