<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribut Elemen Form</title>
</head>
<body>
    <form action="" method="post">
        <p>No. id : <input type="text" name="id"></p>
        <p>No. id : <input type="text" name="id" hidden></p><!--hidden untuk mengnonaktifkan salah satu input-->
        <p>No. id : <input type="text" name="id" disabled></p><!--disabled tetap ada inputnya tetapi tidak bisa di klik atau menginputnya-->
        <p>Nama Lengkap : <input type="text" name="Nama_Lengkap" autofocus></p><!-- autofocus otomatis meng aktifkan kursor ke nama lengkap-->
        <p>Email : <input type="text" name="Email" autocomplete="off"></p> <!-- autocomplete menghapus hestory dari tulisan-->
    </form>
</body>
</html>
