<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
</head>
<body>
    <h2>Form Registrasi Kursus</h2>
    <form action="">
    <Fieldset>
        <Legend>Data Peserta Kursus</Legend>
            <p>Nama : <input type="text"></p>
            <p>Alamat : <input type="text"></p>
            <p>Jenis Kelamin : 
                <input type="radio" name="Jenis_Kelamin" id="Laki_Laki"> Laki-Laki
                <input type="radio" name="Jenis_Kelamin" id="Perempuan"> Perempuan
            </p>
            <p>Tempat Lahir : <input type="text"></p>
            <p>Tanggal Lahir : <input type="date" name="" id=""></p>
    </Fieldset>
    <Fieldset>
        <Legend>Paket Pilihan</Legend>
            <p><input type="checkbox"> HTML</p>
            <p><input type="checkbox"> CSS</p>
            <p><input type="checkbox"> Java Script</p>
            <p><input type="checkbox"> PHP</p>
    </Fieldset>
    <Fieldset>
        <Legend>Pilih Jadwal Kursus</Legend>
            <p><input type="radio" name="Pilih_Jadwal_Kursus" id="Pagi">Pagi</p>
            <p><input type="radio" name="Pilih_Jadwal_Kursus" id="Siang">Siang</p>
            <p><input type="radio" name="Pilih_Jadwal_Kursus" id="Sore">Sore</p>
    </Fieldset>
        <p>Uang Pendaftaran <input type="text" value="Rp. 150.000,00"></p>
        <button type="submit" name="submit">Kirim Data</button>
</form>
</body>
</html>
