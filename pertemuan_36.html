<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date and time</title>
</head>
<body>
    <form action="">
        <p>Tanggal : <input type="date" name="Tanggal"></p>
        <p>Waktu : <input type="time" name="Waktu"></p>
        <p>Tanggal dan Waktu : <input type="datetime-local" name="Tanggal_dan_Waktu"></p>
        <p>Bulan dan Tahun : <input type="month" name="Bulan_dan_Tahun"></p>
        <p>Minggu ke : <input type="week" name="Minggu_ke"></p>
    </form>
</body>
</html>
